<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML 比较工具</title>

    <!-- ✅ 只做美化：不改你的接口、不改 fetch 路径、不改 id、不改事件绑定 -->
    <style>
        :root{
            --bg0:#0b1220;
            --bg1:#0f172a;
            --card:#0b1220cc;
            --card2:#111c33cc;
            --text:#e5e7eb;
            --muted:#9ca3af;
            --line:rgba(255,255,255,.10);
            --line2:rgba(255,255,255,.14);

            --primary:#6366f1;
            --primary2:#8b5cf6;
            --success:#22c55e;
            --warn:#f59e0b;
            --danger:#ef4444;

            --shadow: 0 18px 60px rgba(0,0,0,.45);
            --shadow2: 0 10px 30px rgba(0,0,0,.35);

            --r12:12px;
            --r16:16px;
            --r20:20px;
        }

        *{ box-sizing:border-box; }
        html,body{ height:100%; }
        body{
            margin:0;
            color:var(--text);
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
            Roboto, Helvetica, Arial, "PingFang SC","Microsoft YaHei", sans-serif;

            /* 极致背景：渐变 + 轻微纹理 */
            background:
                radial-gradient(1200px 700px at 18% 12%, rgba(99,102,241,.32), transparent 60%),
                radial-gradient(900px 600px at 84% 22%, rgba(139,92,246,.28), transparent 62%),
                radial-gradient(1200px 700px at 50% 100%, rgba(34,197,94,.10), transparent 56%),
                linear-gradient(180deg, var(--bg1), var(--bg0));
        }

        /* 页面容器 */
        .page{
            width:min(1200px, calc(100% - 48px));
            margin:32px auto 40px;
        }

        /* 顶部标题栏 */
        .hero{
            display:flex;
            align-items:flex-end;
            justify-content:space-between;
            gap:16px;
            margin-bottom:16px;
        }
        .hero h2{
            margin:0;
            font-size:22px;
            letter-spacing:.4px;
        }
        .hero .sub{
            margin:6px 0 0;
            color:var(--muted);
            font-size:13px;
        }
        .hero .chip{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:8px 12px;
            border-radius:999px;
            background:linear-gradient(90deg, rgba(99,102,241,.20), rgba(139,92,246,.18));
            border:1px solid var(--line2);
            box-shadow: var(--shadow2);
            color:#eaeaff;
            font-weight:600;
            font-size:12px;
            white-space:nowrap;
        }
        .dot{
            width:8px;height:8px;border-radius:50%;
            background: radial-gradient(circle at 35% 35%, #fff, rgba(255,255,255,.25));
            box-shadow: 0 0 0 4px rgba(99,102,241,.18);
        }

        /* 玻璃卡片 */
        .panel{
            background: linear-gradient(180deg, rgba(17,28,51,.72), rgba(11,18,32,.72));
            border: 1px solid var(--line);
            border-radius: var(--r20);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            overflow:hidden;
        }

        .panel-inner{
            padding:18px 18px 16px;
        }

        /* 分组标题 */
        h3{
            margin:0 0 12px 0;
            font-size:14px;
            color:#f3f4f6;
            letter-spacing:.2px;
        }

        /* grid 布局 */
        .grid-2{
            display:grid;
            grid-template-columns: 1fr 1fr;
            gap:14px;
        }
        @media (max-width: 860px){
            .grid-2{ grid-template-columns: 1fr; }
        }

        /* 输入控件 */
        label{
            display:block;
            margin:0 0 8px 0;
            color:var(--muted);
            font-size:12px;
        }

        .path-input{
            width:100%;
            padding:10px 12px;
            border-radius: var(--r12);
            border: 1px solid var(--line);
            background: rgba(2,6,23,.35);
            color: var(--text);
            outline:none;
            transition:.18s;
        }
        .path-input::placeholder{ color: rgba(156,163,175,.65); }
        .path-input:focus{
            border-color: rgba(99,102,241,.65);
            box-shadow: 0 0 0 4px rgba(99,102,241,.16);
        }

        /* 原有 file input 继续隐藏 */
        input[type="file"]{ display:none; }

        /* 文件选择按钮美化（沿用你原来的 class=file-btn） */
        .file-row{
            display:flex;
            align-items:center;
            gap:10px;
            flex-wrap:wrap;
        }
        .file-btn{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            padding:10px 12px;
            border-radius: var(--r16);
            cursor:pointer;
            user-select:none;
            border:1px solid var(--line2);
            background: linear-gradient(90deg, rgba(99,102,241,.25), rgba(139,92,246,.18));
            color:#f5f7ff;
            font-weight:700;
            letter-spacing:.1px;
            transition:.18s;
        }
        .file-btn:hover{
            transform: translateY(-1px);
            box-shadow: 0 12px 30px rgba(99,102,241,.18);
            border-color: rgba(99,102,241,.55);
        }
        .file-btn:active{
            transform: translateY(0px);
            box-shadow:none;
        }

        /* 文件名展示 */
        .file-name{
            color: var(--muted);
            font-size:12px;
            padding:6px 10px;
            border:1px solid var(--line);
            border-radius:999px;
            background: rgba(2,6,23,.28);
            max-width: 100%;
            overflow:hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 按钮（沿用你原来的 class=btn） */
        .actions{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            margin-top:10px;
        }
        .btn{
            padding:10px 14px;
            border-radius: var(--r16);
            border:1px solid var(--line2);
            cursor:pointer;
            font-weight:800;
            color:#f8fafc;
            background: linear-gradient(90deg, rgba(99,102,241,.85), rgba(139,92,246,.80));
            transition:.18s;
        }
        .btn:hover{
            transform: translateY(-1px);
            box-shadow: 0 12px 30px rgba(99,102,241,.22);
        }
        .btn:active{ transform: translateY(0); box-shadow:none; }

        /* 次级按钮：导出用 */
        #exportBtn{
            background: linear-gradient(90deg, rgba(148,163,184,.20), rgba(148,163,184,.12));
            color:#e5e7eb;
        }
        #exportBtn:hover{
            border-color: rgba(148,163,184,.55);
            box-shadow: 0 12px 30px rgba(148,163,184,.15);
        }

        /* 分割线 */
        .divider{
            height:1px;
            background: var(--line);
            margin:16px 0;
        }

        /* 结果表格容器 */
        .table-wrap{
            border:1px solid var(--line);
            border-radius: var(--r16);
            overflow:hidden;
            background: rgba(2,6,23,.18);
        }

        #resultTable{
            border-collapse: separate;
            border-spacing: 0;
            width:100%;
            margin-top:0;
            font-size:13px;
        }

        #resultTable thead th{
            position: sticky;
            top: 0;
            z-index: 2;
            text-align:left;
            padding:12px 10px;
            background: linear-gradient(180deg, rgba(17,28,51,.92), rgba(17,28,51,.70));
            border-bottom:1px solid var(--line2);
            color:#f3f4f6;
            font-size:12px;
            letter-spacing:.25px;
            white-space:nowrap;
        }

        #resultTable tbody td{
            border-bottom:1px solid var(--line);
            padding:10px;
            vertical-align: top;
            color:#e5e7eb;
        }
        #resultTable tbody tr:hover td{
            background: rgba(99,102,241,.06);
        }

        pre{
            margin:0;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            color:#d1d5db;
        }

        /* 让表格区域滚动（不改你的 table id） */
        .scroll{
            max-height: 480px;
            overflow:auto;
        }

        /* 小提示 */
        .hint{
            color: var(--muted);
            font-size:12px;
            line-height: 1.5;
        }

        /* 标题区块（替代原来的纯 h3 视觉） */
        .section-head{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
            margin: 6px 0 12px;
        }
        .section-head .title{
            display:flex; align-items:center; gap:10px;
        }
        .tag{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:6px 10px;
            border-radius:999px;
            border:1px solid var(--line);
            background: rgba(2,6,23,.22);
            color:#cbd5e1;
            font-size:12px;
            font-weight:700;
        }

        /* 让原来 body 的 margin 20px 不再影响 */
        body > * { margin: 0; }
    </style>
</head>

<body>
<div class="page">
    <div class="hero">
        <div>
            <h2>XML 文件比较工具</h2>
            <p class="sub">单文件 / 批量对比，结果可导出 CSV（仅 UI 美化，接口调用逻辑保持不变）</p>
        </div>
        <div class="chip"><span class="dot"></span> Pro UI</div>
    </div>

    <div class="panel">
        <div class="panel-inner">

            <!-- 🔹 1. 批量比较（路径输入方式，可选） -->
            <div class="section-head">
                <div class="title">
                    <h3 style="margin:0;">批量比较</h3>
                    <span class="tag">输入文件夹路径（可选）</span>
                </div>
                <div class="hint">服务端需可访问这些目录</div>
            </div>

            <div class="grid-2">
                <div>
                    <label>Source 文件夹路径</label>
                    <input type="text" id="sourceDirPath" class="path-input" placeholder="例如: C:/xml/source（注意：服务要可访问到此目录）">
                </div>
                <div>
                    <label>Target 文件夹路径</label>
                    <input type="text" id="targetDirPath" class="path-input" placeholder="例如: C:/xml/target（注意：服务要可访问到此目录）">
                </div>
            </div>

            <div style="margin-top:12px;">
                <label>Report 输出目录</label>
                <input type="text" id="reportDirPath" class="path-input" placeholder="例如: C:/xml/report（注意：服务要可访问到此目录）">
            </div>

            <div class="actions">
                <button id="batchCompareBtn" class="btn">批量比较</button>
            </div>

            <div class="divider"></div>

            <!-- 🔹 2. 单文件比较 -->
            <div class="section-head">
                <div class="title">
                    <h3 style="margin:0;">单文件比较</h3>
                    <span class="tag">上传 Source / Target</span>
                </div>
                <div class="hint">支持超长内容 hover 查看全量（title）</div>
            </div>

            <div class="grid-2">
                <div class="card2" style="padding:14px;border-radius:var(--r16);border:1px solid var(--line);background:rgba(2,6,23,.18);">
                    <div class="file-row">
                        <label class="file-btn">选择 Source XML
                            <input type="file" id="sourceFile" name="sourceFile">
                        </label>
                        <span id="sourceName" class="file-name"></span>
                    </div>
                </div>

                <div class="card2" style="padding:14px;border-radius:var(--r16);border:1px solid var(--line);background:rgba(2,6,23,.18);">
                    <div class="file-row">
                        <label class="file-btn">选择 Target XML
                            <input type="file" id="targetFile" name="targetFile">
                        </label>
                        <span id="targetName" class="file-name"></span>
                    </div>
                </div>
            </div>

            <div class="actions">
                <button id="compareBtn" class="btn">单文件比较</button>
                <button id="exportBtn" class="btn">导出 CSV</button>
            </div>

            <div class="divider"></div>

            <!-- 结果 -->
            <div class="section-head">
                <div class="title">
                    <h3 style="margin:0;">比较结果</h3>
                    <span class="tag">表头吸顶 · 可滚动</span>
                </div>
                <div class="hint">提示：Source/Target 列默认折叠显示，hover 看全量</div>
            </div>

            <div class="table-wrap">
                <div class="scroll">
                    <table id="resultTable">
                        <thead>
                        <tr>
                            <th style="width:110px;">Type</th>
                            <th style="width:260px;">Message</th>
                            <th style="width:260px;">XPath</th>
                            <th>Source</th>
                            <th>Target</th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    const sourceInput = document.getElementById('sourceFile');
    const targetInput = document.getElementById('targetFile');
    const sourceName = document.getElementById('sourceName');
    const targetName = document.getElementById('targetName');
    let lastCompareResult = [];

    sourceInput.addEventListener('change', () => sourceName.textContent = sourceInput.files[0]?.name || '');
    targetInput.addEventListener('change', () => targetName.textContent = targetInput.files[0]?.name || '');

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function renderTable(data) {
        const tbody = document.querySelector('#resultTable tbody');
        tbody.innerHTML = '';
        data.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${escapeHtml(item.type)}</td>
                <td>${escapeHtml(item.message)}</td>
                <td>${escapeHtml(item.xpath)}</td>
                <td><pre title="${escapeHtml(item.sourceValue)}">${escapeHtml(item.sourceValue)}</pre></td>
                <td><pre title="${escapeHtml(item.targetValue)}">${escapeHtml(item.targetValue)}</pre></td>
            `;
            tbody.appendChild(tr);
        });
        lastCompareResult = data;
    }

    function exportCSV(data) {
        if (!data || data.length === 0) {
            alert("没有比较结果可导出");
            return;
        }
        let csv = "Type,Message,XPath,Source,Target\n";
        data.forEach(item => {
            csv += `"${item.type || ''}","${item.message || ''}","${item.xpath || ''}","${(item.sourceValue || '').replace(/"/g, '""')}","${(item.targetValue || '').replace(/"/g, '""')}"\n`;
        });
        const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = Date.now() + '_compare_result.csv';
        a.click();
        URL.revokeObjectURL(url);
    }

    // 单文件比较（✅ 原样保留：接口、formData key、路径都不动）
    document.getElementById('compareBtn').addEventListener('click', () => {
        if (!sourceInput.files[0] || !targetInput.files[0]) {
            alert('请先选择两个 XML 文件');
            return;
        }
        const formData = new FormData();
        formData.append('sourceFile', sourceInput.files[0]);
        formData.append('targetFile', targetInput.files[0]);

        fetch('/main/xml/compare/upload', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(result => {
                if (result.code === 20000) {
                    renderTable(result.data || []);
                } else {
                    alert(result.msg || '比较失败');
                }
            })
            .catch(err => alert('比较失败: ' + err));
    });

    // 导出 CSV（✅ 原样保留）
    document.getElementById('exportBtn').addEventListener('click', () => exportCSV(lastCompareResult));

    // 批量比较（✅ 原样保留：接口、formData key、路径都不动）
    document.getElementById('batchCompareBtn').addEventListener('click', () => {
        const formData = new FormData();
        const sourceDirPath = document.getElementById('sourceDirPath').value.trim();
        const targetDirPath = document.getElementById('targetDirPath').value.trim();
        const reportDirPath = document.getElementById('reportDirPath').value.trim();

        if (sourceDirPath) formData.append('sourceDir', sourceDirPath);
        if (targetDirPath) formData.append('targetDir', targetDirPath);
        if (reportDirPath) formData.append('reportDir', reportDirPath);

        fetch('/main/xml/compare/batch', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(result => {
                if (result.code === 20000) {
                    alert('批量比较完成' + (result.data || ''));
                } else {
                    alert(result.msg || '批量比较失败');
                }
            })
            .catch(err => alert('批量比较失败: ' + err));
    });
</script>
</body>
</html>
