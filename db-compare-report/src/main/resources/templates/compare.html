<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XML 比较工具</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        label { display: block; margin-bottom: 10px; }
        input[type="file"] { display: none; }
        .file-btn {
            display: inline-block;
            padding: 6px 12px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }
        #resultTable { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 5px; text-align: left; vertical-align: top; }
        th { background-color: #f2f2f2; }
        pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn {
            padding: 6px 12px;
            margin-top: 10px;
            background-color: #2196F3;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<h2>XML 文件比较</h2>

<div>
    <label class="file-btn">选择 Source XML
        <input type="file" id="sourceFile" name="sourceFile">
    </label>
    <span id="sourceName"></span>
</div>
<div>
    <label class="file-btn">选择 Target XML
        <input type="file" id="targetFile" name="targetFile">
    </label>
    <span id="targetName"></span>
</div>
<br>
<button id="compareBtn" class="btn">比较</button>
<button id="exportBtn" class="btn">导出 CSV</button>

<h3>比较结果：</h3>
<table id="resultTable">
    <thead>
    <tr>
        <th>Type</th>
        <th>Message</th>
        <th>XPath</th>
        <th>Source</th>
        <th>Target</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
    const sourceInput = document.getElementById('sourceFile');
    const targetInput = document.getElementById('targetFile');
    const sourceName = document.getElementById('sourceName');
    const targetName = document.getElementById('targetName');
    let lastCompareResult = []; // 保存最后一次比较结果

    sourceInput.addEventListener('change', () => {
        sourceName.textContent = sourceInput.files[0]?.name || '';
    });
    targetInput.addEventListener('change', () => {
        targetName.textContent = targetInput.files[0]?.name || '';
    });

    // escape HTML 特殊字符
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // 导出 CSV 文件
    function exportCSV(data) {
        if (!data || data.length === 0) {
            alert("没有比较结果可导出");
            return;
        }

        let csv = "Type,Message,XPath,Source,Target\n";
        data.forEach(item => {
            csv += `"${item.type || ''}","${item.message || ''}","${item.xpath || ''}","${(item.sourceValue || '').replace(/"/g, '""')}","${(item.targetValue || '').replace(/"/g, '""')}"\n`;
        });

        // ✅ 在最前面加 BOM，避免 Excel 打开乱码
        const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        // ✅ 用时间戳作为文件名
        a.download = Date.now() + '_compare_result.csv';
        a.click();

        URL.revokeObjectURL(url);
    }

    document.getElementById('compareBtn').addEventListener('click', () => {
        if (!sourceInput.files[0] || !targetInput.files[0]) {
            alert('请先选择两个 XML 文件');
            return;
        }

        const formData = new FormData();
        formData.append('sourceFile', sourceInput.files[0]);
        formData.append('targetFile', targetInput.files[0]);

        fetch('/main/xml/compare/upload', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                const tbody = document.querySelector('#resultTable tbody');
                tbody.innerHTML = '';
                if (!Array.isArray(data)) {
                    alert('返回数据不是数组: ' + JSON.stringify(data));
                    return;
                }
                lastCompareResult = data; // 保存结果
                data.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${escapeHtml(item.type)}</td>
                        <td>${escapeHtml(item.message)}</td>
                        <td>${escapeHtml(item.xpath)}</td>
                        <td><pre title="${escapeHtml(item.sourceValue)}">${escapeHtml(item.sourceValue)}</pre></td>
                        <td><pre title="${escapeHtml(item.targetValue)}">${escapeHtml(item.targetValue)}</pre></td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => alert('比较失败: ' + err));
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
        exportCSV(lastCompareResult);
    });
</script>
</body>
</html>
